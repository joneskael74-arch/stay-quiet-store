<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STAY QUIET — Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090909;color:#eee;font-family:Arial,sans-serif}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 20%,#242424,#090909 48%)}.card,.modalbox{width:min(650px,100%);padding:28px;background:#151515;border:1px solid #333;border-radius:14px}.card{max-width:440px}.brand{text-align:center;font-size:28px;letter-spacing:6px;font-weight:700}h1,h2{margin:0 0 12px}.muted{color:#999}label{display:block;font-size:12px;letter-spacing:2px;color:#aaa;margin:16px 0 7px}input,textarea,select{width:100%;padding:13px 14px;border:1px solid #444;border-radius:8px;background:#111;color:#eee}textarea{min-height:120px}.btn{border:1px solid #555;background:#eee;color:#111;padding:13px 18px;border-radius:8px;font-weight:700;letter-spacing:1px;cursor:pointer}.dark{background:#171717;color:#eee}.danger{background:#3a1515;color:#fff}.error{color:#ff8c8c;margin-top:12px;min-height:18px}.top{height:74px;border-bottom:1px solid #252525;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.top .brand{font-size:20px}.main{padding:28px;max-width:1200px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.actions{display:flex;gap:10px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:20px}.stat,.product{border:1px solid #292929;border-radius:12px;background:#111}.stat{padding:18px}.stat strong{display:block;font-size:28px;margin-top:6px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.product{overflow:hidden}.product img{width:100%;height:190px;object-fit:cover;background:#191919}.product-body{padding:16px}.product h3{margin:8px 0}.price{font-size:20px;font-weight:700}.meta{display:flex;justify-content:space-between;color:#999;font-size:13px;margin:10px 0}.badge{display:inline-block;padding:5px 8px;border:1px solid #444;border-radius:999px;font-size:11px}.modal{display:none;position:fixed;inset:0;background:#000d;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.show{display:flex}.modalbox{max-height:92vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{background:none;border:0;color:#aaa;font-size:28px;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-actions{display:flex;gap:10px;margin-top:18px}@media(max-width:700px){.row,.stats{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}
</style></head><body>
<section id="loginScreen" class="login"><div class="card"><div class="brand">STAY QUIET</div><h2 style="margin-top:28px">Admin Login</h2><p class="muted">PRIVATE STORE MANAGEMENT</p>
<label>EMAIL</label><input id="email" type="email" autocomplete="username"><label>PASSWORD</label><input id="password" type="password" autocomplete="current-password"><button id="loginButton" class="btn" style="width:100%;margin-top:20px">ENTER ADMIN</button><div id="loginError" class="error"></div></div></section>
<section id="app" class="hidden"><header class="top"><div class="brand">STAY QUIET</div><button id="logoutButton" class="btn dark">LOG OUT</button></header><main class="main"><div class="head"><div><h1>Products</h1><div class="muted">MONGODB STORE DATABASE</div></div><button id="addButton" class="btn">+ ADD PRODUCT</button></div>
<div class="stats"><div class="stat"><span class="muted">PRODUCTS</span><strong id="productCount">0</strong></div><div class="stat"><span class="muted">PUBLISHED</span><strong id="publishedCount">0</strong></div></div><div id="productsGrid" class="grid"></div><div id="productsError" class="error"></div></main></section>
<div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">Add Product</h2><button id="closeButton" class="close">&times;</button></div>
<input id="editId" type="hidden"><label>PRODUCT NAME</label><input id="name"><div class="row"><div><label>PRICE</label><input id="price" type="number" step="0.01" min="0"></div><div><label>STOCK</label><input id="qty" type="number" min="0"></div></div>
<div class="row"><div><label>CATEGORY</label><input id="category"></div><div><label>STATUS</label><select id="status"><option value="published">Published</option><option value="draft">Draft</option></select></div></div>
<label>IMAGE URL</label><input id="imageUrl" type="url"><label>OR UPLOAD IMAGE</label><input id="imageFile" type="file" accept="image/*"><label>DESCRIPTION</label><textarea id="description"></textarea>
<div id="saveError" class="error"></div><div class="form-actions"><button id="saveButton" class="btn">SAVE PRODUCT</button><button id="cancelButton" class="btn dark">CANCEL</button></div></div></div>
<script>
"use strict";
let products=[];
const $=id=>document.getElementById(id);
async function api(url,options={}){const o={...options,credentials:"same-origin"};o.headers={...(options.headers||{})};if(options.body&&!(options.body instanceof FormData)&&!o.headers["Content-Type"])o.headers["Content-Type"]="application/json";const r=await fetch(url,o);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||"Request failed ("+r.status+")");return d}
async function login(){const e=$("loginError");e.textContent="";const email=$("email").value.trim(),password=$("password").value;if(!email||!password){e.textContent="Enter your email and password.";return}const b=$("loginButton");b.disabled=true;b.textContent="SIGNING IN...";try{await api("/api/login",{method:"POST",body:JSON.stringify({email,password})});await boot()}catch(x){e.textContent=x.message}finally{b.disabled=false;b.textContent="ENTER ADMIN"}}
async function boot(){try{await api("/api/me");$("loginScreen").classList.add("hidden");$("app").classList.remove("hidden");await loadProducts()}catch{$("loginScreen").classList.remove("hidden");$("app").classList.add("hidden")}}
async function logout(){try{await api("/api/logout",{method:"POST"})}finally{$("app").classList.add("hidden");$("loginScreen").classList.remove("hidden");$("password").value=""}}
async function loadProducts(){try{products=await api("/api/products");renderProducts()}catch(x){$("productsError").textContent=x.message}}
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function renderProducts(){const p=products.filter(x=>x.status==="published");$("productCount").textContent=products.length;$("publishedCount").textContent=p.length;const g=$("productsGrid");if(!products.length){g.innerHTML='<div class="muted">No products yet. Click + ADD PRODUCT.</div>';return}g.innerHTML=products.map(x=>'<article class="product">'+(x.imageUrl?'<img src="'+esc(x.imageUrl)+'">':'<div style="height:190px;display:grid;place-items:center;color:#777">NO IMAGE</div>')+'<div class="product-body"><span class="badge">'+esc(x.status||"draft")+'</span><h3>'+esc(x.name||"Untitled")+'</h3><div class="price">$'+Number(x.price||0).toFixed(2)+'</div><div class="meta"><span>Stock: '+Number(x.qty||0)+'</span><span>'+esc(x.category||"")+'</span></div><p class="muted">'+esc(x.description||"")+'</p><div class="actions"><button class="btn dark" onclick="editProduct(''+esc(x._id)+'')">EDIT</button><button class="btn danger" onclick="deleteProduct(''+esc(x._id)+'')">DELETE</button></div></div></article>').join("")}
function openModal(p=null){$("saveError").textContent="";$("modal").classList.add("show");$("modalTitle").textContent=p?"Edit Product":"Add Product";$("editId").value=p?. _id||"";$("name").value=p?.name||"";$("price").value=p?.price??"";$("qty").value=p?.qty??"";$("category").value=p?.category||"";$("status").value=p?.status||"published";$("imageUrl").value=p?.imageUrl||"";$("imageFile").value="";$("description").value=p?.description||""}
function closeModal(){$("modal").classList.remove("show")}
async function saveProduct(){const err=$("saveError");err.textContent="";const name=$("name").value.trim();if(!name){err.textContent="Product name is required.";return}const b=$("saveButton");b.disabled=true;b.textContent="SAVING...";try{let imageUrl=$("imageUrl").value.trim();const f=$("imageFile").files[0];if(f){const fd=new FormData();fd.append("image",f);const u=await api("/api/upload",{method:"POST",body:fd});imageUrl=u.url||""}const product={name,price:Number($("price").value||0),qty:Number($("qty").value||0),category:$("category").value.trim(),status:$("status").value,imageUrl,description:$("description").value.trim()};const id=$("editId").value.trim();await api(id?"/api/products/"+encodeURIComponent(id):"/api/products",{method:id?"PUT":"POST",body:JSON.stringify(product)});closeModal();await loadProducts()}catch(x){err.textContent=x.message}finally{b.disabled=false;b.textContent="SAVE PRODUCT"}}
function editProduct(id){const p=products.find(x=>String(x._id)===String(id));if(p)openModal(p)}
async function deleteProduct(id){if(!confirm("Delete this product?"))return;try{await api("/api/products/"+encodeURIComponent(id),{method:"DELETE"});await loadProducts()}catch(x){$("productsError").textContent=x.message}}
$("loginButton").addEventListener("click",login);$("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});$("logoutButton").addEventListener("click",logout);$("addButton").addEventListener("click",()=>openModal());$("closeButton").addEventListener("click",closeModal);$("cancelButton").addEventListener("click",closeModal);$("saveButton").addEventListener("click",saveProduct);$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal()});boot();
</script></body></html>
