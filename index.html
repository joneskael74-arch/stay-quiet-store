<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>STAY QUIET❕ Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#eee;font-family:Arial,Helvetica,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 20%,#242424 0,#090909 48%)}.card{width:min(440px,100%);border:1px solid #2a2a2a;background:#101010;padding:34px}.brand{text-align:center;letter-spacing:7px;font-size:24px;margin-bottom:30px}
label{display:block;font-size:12px;letter-spacing:2px;color:#999;margin:16px 0 8px}input,textarea,select{width:100%;background:#080808;border:1px solid #333;color:#fff;padding:13px;outline:none}textarea{min-height:110px;resize:vertical}
.btn{border:0;background:#eee;color:#111;padding:13px 18px;font-weight:700;letter-spacing:1px}.dark{background:#171717;color:#eee;border:1px solid #333}.error{color:#e99;margin-top:12px;font-size:13px}.muted{color:#888;font-size:12px;letter-spacing:1px}
.hidden{display:none!important}.top{height:74px;border-bottom:1px solid #252525;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#0c0c0c}.top .brand{margin:0;font-size:18px}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 74px)}.side{border-right:1px solid #252525;padding:22px;background:#0c0c0c}.nav{width:100%;text-align:left;background:transparent;border:0;color:#aaa;padding:13px 8px}.nav.active,.nav:hover{color:#fff;background:#171717}
.main{padding:28px;max-width:1200px;width:100%}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.head h1{font-weight:400;margin:0 0 5px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:25px}.stat{border:1px solid #292929;padding:20px;background:#101010}.stat b{display:block;font-size:28px;margin-top:7px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.product{border:1px solid #292929;background:#101010}.pic{height:220px;background:#050505;display:grid;place-items:center;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.pbody{padding:15px}.pbody h3{margin:7px 0;font-weight:500}.price{font-size:18px}.actions{display:flex;gap:8px;margin-top:13px}.actions button{flex:1;padding:10px;border:1px solid #333;background:#171717;color:#fff}.empty{border:1px dashed #333;padding:45px;text-align:center;color:#777}
.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:20px}.modalbox{width:min(620px,100%);max-height:90vh;overflow:auto;background:#111;border:1px solid #333;padding:25px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.modalhead{display:flex;justify-content:space-between}.close{background:none;border:0;color:#aaa;font-size:25px}
@media(max-width:760px){.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto;border-right:0;border-bottom:1px solid #252525}.nav{white-space:nowrap;width:auto}.stats{grid-template-columns:1fr}.row{grid-template-columns:1fr}.main{padding:18px}}
</style></head><body>
<section id="login" class="login"><div class="card"><div class="brand">STAY QUIET</div><h2>Admin Login</h2><p class="muted">PRIVATE STORE MANAGEMENT</p>
<label>EMAIL</label><input id="email" type="email"><label>PASSWORD</label><input id="password" type="password"><button class="btn" style="width:100%;margin-top:20px" onclick="login()">ENTER ADMIN</button><div id="loginError" class="error"></div></div></section>
<section id="app" class="hidden"><header class="top"><div class="brand">STAY QUIET</div><button class="btn dark" onclick="logout()">LOG OUT</button></header>
<div class="layout"><aside class="side"><button class="nav active">Products</button><button class="nav" onclick="alert('Orders are next after checkout is connected.')">Orders</button></aside>
<main class="main"><div class="head"><div><h1>Products</h1><div class="muted">MONGODB STORE DATABASE</div></div><button class="btn" onclick="openModal()">+ ADD PRODUCT</button></div>
<div class="stats"><div class="stat"><span class="muted">PRODUCTS</span><b id="count">0</b></div><div class="stat"><span class="muted">PUBLISHED</span><b id="published">0</b></div><div class="stat"><span class="muted">IN STOCK</span><b id="stock">0</b></div></div><div id="grid" class="grid"></div></main></div></section>
<div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">Add Product</h2><button class="close" onclick="closeModal()">×</button></div><input type="hidden" id="editId">
<label>PRODUCT NAME</label><input id="name"><div class="row"><div><label>PRICE</label><input id="price" type="number" step=".01"></div><div><label>STOCK</label><input id="qty" type="number"></div></div>
<div class="row"><div><label>CATEGORY</label><input id="category"></div><div><label>STATUS</label><select id="status"><option value="published">Published</option><option value="draft">Draft</option></select></div></div>
<label>IMAGE URL</label><input id="imageUrl" placeholder="https://..."><label>OR UPLOAD IMAGE</label><input id="imageFile" type="file" accept="image/*"><label>DESCRIPTION</label><textarea id="description"></textarea>
<div id="saveError" class="error"></div><div style="display:flex;gap:10px;margin-top:20px"><button class="btn" onclick="saveProduct()">SAVE PRODUCT</button><button class="btn dark" onclick="closeModal()">CANCEL</button></div></div></div>
<script>
let products=[];
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d}
async function login(){
  try{
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    await api("/api/login", {
      method:"POST",
      body:JSON.stringify({
        email:emailInput.value,
        password:passwordInput.value
      })
    });

    await boot();
  }catch(e){
    document.getElementById("loginError").textContent = e.message;
  }
}
async function boot(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await load()}
async function logout(){await api('/api/logout',{method:'POST'});location.reload()}
async function load(){products=await api('/api/products');render()}
function render(){count.textContent=products.length;published.textContent=products.filter(p=>p.status==='published').length;stock.textContent=products.reduce((n,p)=>n+Number(p.qty||0),0);grid.innerHTML=products.length?products.map(p=>`<article class="product"><div class="pic">${p.imageUrl?`<img src="${esc(p.imageUrl)}">`:'<span class="muted">NO IMAGE</span>'}</div><div class="pbody"><div class="muted">${esc(p.category||'UNCATEGORIZED')} · ${p.status.toUpperCase()}</div><h3>${esc(p.name)}</h3><div class="price">$${Number(p.price||0).toFixed(2)}</div><div class="muted">STOCK: ${Number(p.qty||0)}</div><div class="actions"><button onclick="editProduct('${p._id}')">EDIT</button><button onclick="delProduct('${p._id}')">DELETE</button></div></div></article>`).join(''):'<div class="empty">No products yet. Click <b>+ ADD PRODUCT</b>.</div>'}
function openModal(p=null){modal.style.display='flex';modalTitle.textContent=p?'Edit Product':'Add Product';editId.value=p?._id||'';name.value=p?.name||'';price.value=p?.price??'';qty.value=p?.qty??'';category.value=p?.category||'';status.value=p?.status||'published';imageUrl.value=p?.imageUrl||'';description.value=p?.description||'';imageFile.value='';saveError.textContent=''}
function closeModal(){modal.style.display='none'}
function editProduct(id){const p=products.find(x=>String(x._id)===String(id));if(p)openModal(p)}
async function saveProduct(){
  try{
    const productName = document.getElementById("name").value.trim();
    const productPrice = Number(document.getElementById("price").value || 0);
    const productQty = Number(document.getElementById("qty").value || 0);
    const productCategory = document.getElementById("category").value.trim();
    const productStatus = document.getElementById("status").value;
    const productImageUrl = document.getElementById("imageUrl").value.trim();
    const productDescription = document.getElementById("description").value.trim();

    if(!productName){
      saveError.textContent = "Product name is required";
      return;
    }

    let imageUrl = productImageUrl;

    const imageFile = document.getElementById("imageFile").files[0];

    if(imageFile){
      const fd = new FormData();
      fd.append("image", imageFile);

      const uploadResponse = await fetch("/api/upload", {
        method:"POST",
        body:fd
      });

      const uploadData = await uploadResponse.json();

      if(!uploadResponse.ok){
        throw new Error(uploadData.error || "Image upload failed");
      }

      imageUrl = uploadData.url;
    }

    const product = {
      name: productName,
      price: productPrice,
      qty: productQty,
      category: productCategory,
      status: productStatus,
      imageUrl: imageUrl,
      description: productDescription
    };

    const id = editId.value;

    const response = await api(
      id ? `/api/products/${id}` : "/api/products",
      {
        method: id ? "PUT" : "POST",
        body: JSON.stringify(product)
      }
    );

    closeModal();
    await load();

  }catch(error){
    saveError.textContent = error.message;
  }
}
